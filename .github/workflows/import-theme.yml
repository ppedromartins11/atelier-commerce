name: Importar tema Shopify
on:
  push:
    paths:
      - 'bootstrap/payload.txt'
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Descompactar projeto
        run: |
          python3 - <<'PY'
          import base64, json, lzma
          from pathlib import Path
          chunks = sorted(Path('bootstrap').glob('part-*.txt'))
          assert len(chunks) == 5, f'Esperados 5 blocos, encontrados {len(chunks)}'
          payload = ''.join(f.read_text(encoding='ascii') for f in chunks)
          files = json.loads(lzma.decompress(base64.b85decode(payload)))
          assert len(files) == 49, f'Esperados 49 arquivos, encontrados {len(files)}'
          for name, content in files.items():
              if name.startswith('.github/workflows/'):
                  continue
              target = Path(name)
              if target.is_absolute() or '..' in target.parts or target.parts[0] == 'bootstrap':
                  raise ValueError(f'Unsafe path: {name}')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          print(f'Imported {len(files)} files')
          PY
      - name: Validar projeto
        run: |
          npm test
          npm run check:js
      - name: Registrar tema no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r bootstrap
          git add -A
          git commit -m "feat: adicionar tema Shopify Atelier Commerce v0.1.0"
          git push
